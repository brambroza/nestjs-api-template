# Local dev stack. `docker compose up -d` then `npm run start:dev`.
# The e2e test suite (Phase 5c) uses testcontainers to spin its own
# short-lived DB and Redis, so leave this compose file to the developer
# loop.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nestjs-api-template-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev@P4ssw0rd!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P LocalDev@P4ssw0rd! -C -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # MSSQL image doesn't ship databases pre-created — this init helper
  # creates the app database once the server is healthy, then exits.
  mssql-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: nestjs-api-template-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "
        /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P 'LocalDev@P4ssw0rd!'
        -Q \"IF DB_ID('nestjs_api_template') IS NULL CREATE DATABASE nestjs_api_template;\"
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: nestjs-api-template-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mssql-data:
  redis-data:
